name: Audit Badge CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run audit script
        run: npm run audit:identity
      - name: Update badge status (placeholder)
        if: success()
        run: |
          echo "✅ Audit passed" > badge_status.txt
      - name: Fail badge if audit fails
        if: failure()
        run: |
          echo "❌ Audit failed" > badge_status.txt
