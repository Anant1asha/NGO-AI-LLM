<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotspot Reveal</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f6f8fb;color:#182233}main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 4px}.meta{font-size:12px;color:#657185}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin-top:12px}.stage{height:360px;border:1px solid #dfe5ec;border-radius:9px;overflow:hidden;background:#fbfcfe}svg,canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}button,input{font:inherit}button{padding:6px 10px;border:1px solid #cbd3df;border-radius:7px;background:white}.pill{font-size:10px;background:#eef2f7;border-radius:999px;padding:3px 7px;margin-right:4px}</style></head><body><main><h1>Hotspot Reveal</h1><div class="meta">AASHA Visual Resource · AVR-P306 · diagram · v1.0.0</div><div class="card"><span class="pill">TLN</span><span class="pill">LLE</span><span class="pill">TEAS evidence</span><span class="pill">offline</span><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="meta" id="msg"></div></div><script>const AASHA={resource_id:"AVR-P306",version:"1.0.0",tln:{tln_id:"FIXTURE-AVR-P306",version:"1.0.0"},lle:{locale:"en-IN",reveal_mode:"tap"},teas:{evidence_only:true,mastery_decision:false},emit:(type,payload={})=>{window.__AASHA_EVENTS__=(window.__AASHA_EVENTS__||[]).concat({type,payload,sequence_number:(window.__AASHA_EVENTS__||[]).length+1})}};const s=document.querySelector('#stage'),m=document.querySelector('#msg');let a=['Part A','Part B','Part C'];s.innerHTML='<svg viewBox="0 0 900 360" id="x"></svg>';let x=document.querySelector('#x');x.innerHTML=a.map((t,i)=>`<g data-i='${i}'><circle cx='${200+i*250}' cy='180' r='65' fill='#eef2f7' stroke='#8995a7'/><text x='${200+i*250}' y='185' text-anchor='middle'>${t}</text></g>`).join('');x.querySelectorAll('g').forEach(g=>g.onclick=()=>{let t=a[+g.dataset.i];AASHA.emit('reveal',{label:t});m.textContent='Revealed: '+t});</script></main></body></html>
