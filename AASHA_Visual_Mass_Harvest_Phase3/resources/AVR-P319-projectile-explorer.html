<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projectile Explorer</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f6f8fb;color:#182233}main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 4px}.meta{font-size:12px;color:#657185}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin-top:12px}.stage{height:360px;border:1px solid #dfe5ec;border-radius:9px;overflow:hidden;background:#fbfcfe}svg,canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}button,input{font:inherit}button{padding:6px 10px;border:1px solid #cbd3df;border-radius:7px;background:white}.pill{font-size:10px;background:#eef2f7;border-radius:999px;padding:3px 7px;margin-right:4px}</style></head><body><main><h1>Projectile Explorer</h1><div class="meta">AASHA Visual Resource · AVR-P319 · simulation · v1.0.0</div><div class="card"><span class="pill">TLN</span><span class="pill">LLE</span><span class="pill">TEAS evidence</span><span class="pill">offline</span><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="meta" id="msg"></div></div><script>const AASHA={resource_id:"AVR-P319",version:"1.0.0",tln:{tln_id:"FIXTURE-AVR-P319",version:"1.0.0"},lle:{locale:"en-IN",reveal_mode:"tap"},teas:{evidence_only:true,mastery_decision:false},emit:(type,payload={})=>{window.__AASHA_EVENTS__=(window.__AASHA_EVENTS__||[]).concat({type,payload,sequence_number:(window.__AASHA_EVENTS__||[]).length+1})}};const s=document.querySelector('#stage'),c=document.querySelector('#controls'),m=document.querySelector('#msg');let angle=45;function d(){let pts=[];for(let x=0;x<=700;x+=20){let xx=x/100;let y=Math.max(0,xx*Math.tan(angle*Math.PI/180)-.35*xx*xx);pts.push([100+x,320-y*120])}s.innerHTML='<svg viewBox="0 0 900 360"><polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="currentColor" stroke-width="5"/></svg>';m.textContent=`Launch angle = ${angle}°`}let r=document.createElement('input');r.type='range';r.min=10;r.max=80;r.value=angle;r.oninput=()=>{angle=+r.value;AASHA.emit('parameter_change',{angle});d()};c.append('Angle ',r);d();</script></main></body></html>
