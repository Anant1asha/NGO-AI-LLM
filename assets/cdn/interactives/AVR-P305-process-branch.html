<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Process Branch</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f6f8fb;color:#182233}main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 4px}.meta{font-size:12px;color:#657185}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin-top:12px}.stage{height:360px;border:1px solid #dfe5ec;border-radius:9px;overflow:hidden;background:#fbfcfe}svg,canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}button,input{font:inherit}button{padding:6px 10px;border:1px solid #cbd3df;border-radius:7px;background:white}.pill{font-size:10px;background:#eef2f7;border-radius:999px;padding:3px 7px;margin-right:4px}</style></head><body><main><h1>Process Branch</h1><div class="meta">AASHA Visual Resource · AVR-P305 · process · v1.0.0</div><div class="card"><span class="pill">TLN</span><span class="pill">LLE</span><span class="pill">TEAS evidence</span><span class="pill">offline</span><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="meta" id="msg"></div></div><script>const AASHA={resource_id:"AVR-P305",version:"1.0.0",tln:{tln_id:"FIXTURE-AVR-P305",version:"1.0.0"},lle:{locale:"en-IN",reveal_mode:"tap"},teas:{evidence_only:true,mastery_decision:false},emit:(type,payload={})=>{window.__AASHA_EVENTS__=(window.__AASHA_EVENTS__||[]).concat({type,payload,sequence_number:(window.__AASHA_EVENTS__||[]).length+1})}};const s=document.querySelector('#stage'),c=document.querySelector('#controls'),m=document.querySelector('#msg');let b=false;function d(){s.innerHTML=`<svg viewBox='0 0 900 360'><rect x='80' y='140' width='150' height='70' rx='10' fill='#eef2f7' stroke='#8995a7'/><text x='155' y='180' text-anchor='middle'>Input</text><line x1='230' y1='175' x2='370' y2='175' stroke='currentColor' stroke-width='4'/><rect x='370' y='130' width='160' height='90' rx='10' fill='${b?'currentColor':'#eef2f7'}' stroke='#8995a7'/><text x='450' y='180' text-anchor='middle' fill='${b?'white':'currentColor'}'>Decision</text><line x1='530' y1='175' x2='700' y2='110' stroke='#8995a7' stroke-width='4'/><line x1='530' y1='175' x2='700' y2='250' stroke='#8995a7' stroke-width='4'/><text x='750' y='115'>A</text><text x='750' y='255'>B</text></svg>`}let q=document.createElement('button');q.textContent='Toggle branch';q.onclick=()=>{b=!b;AASHA.emit('state_change',{branch:b});m.textContent='Branch state changed';d()};c.append(q);d();</script></main></body></html>
