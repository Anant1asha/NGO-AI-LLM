<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Temperature</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f6f8fb;color:#182233}main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 4px}.meta{font-size:12px;color:#657185}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin-top:12px}.stage{height:360px;border:1px solid #dfe5ec;border-radius:9px;overflow:hidden;background:#fbfcfe}svg,canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}button,input{font:inherit}button{padding:6px 10px;border:1px solid #cbd3df;border-radius:7px;background:white}.pill{font-size:10px;background:#eef2f7;border-radius:999px;padding:3px 7px;margin-right:4px}</style></head><body><main><h1>Particle Temperature</h1><div class="meta">AASHA Visual Resource · AVR-P311 · molecule · v1.0.0</div><div class="card"><span class="pill">TLN</span><span class="pill">LLE</span><span class="pill">TEAS evidence</span><span class="pill">offline</span><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="meta" id="msg"></div></div><script>const s=document.querySelector('#stage'),c=document.querySelector('#controls'),m=document.querySelector('#msg');
s.innerHTML='<canvas id="x"></canvas>';let x=document.querySelector('#x'),q=x.getContext('2d');
x.width=900;x.height=360;let temp=.5;
function draw(){q.clearRect(0,0,900,360);for(let i=0;i<24;i++){let px=50+(i*83)%800,py=60+(i*47)%240;let dx=Math.sin(i*7)*40*temp,dy=Math.cos(i*5)*30*temp;q.beginPath();q.arc(px+dx,py+dy,7,0,7);q.fill()}m.textContent='Temperature = '+temp.toFixed(1);}
let r=document.createElement('input');r.type='range';r.min=.1;r.max=2;r.step=.1;r.value=temp;r.oninput=()=>{temp=+r.value;AASHA.emit('parameter_change',{temperature:temp});draw()};c.append('Temperature ',r);draw();</script></main></body></html>
