<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Strip</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f6f8fb;color:#182233}main{max-width:980px;margin:auto}h1{font-size:22px;margin:0 0 4px}.meta{font-size:12px;color:#657185}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:14px;margin-top:12px}.stage{height:360px;border:1px solid #dfe5ec;border-radius:9px;overflow:hidden;background:#fbfcfe}svg,canvas{width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:10px}button,input{font:inherit}button{padding:6px 10px;border:1px solid #cbd3df;border-radius:7px;background:white}.pill{font-size:10px;background:#eef2f7;border-radius:999px;padding:3px 7px;margin-right:4px}</style></head><body><main><h1>Fraction Strip</h1><div class="meta">AASHA Visual Resource · AVR-P302 · number-line · v1.0.0</div><div class="card"><span class="pill">TLN</span><span class="pill">LLE</span><span class="pill">TEAS evidence</span><span class="pill">offline</span><div class="stage" id="stage"></div><div class="controls" id="controls"></div><div class="meta" id="msg"></div></div><script>const AASHA={resource_id:"AVR-P302",version:"1.0.0",tln:{tln_id:"FIXTURE-AVR-P302",version:"1.0.0"},lle:{locale:"en-IN",reveal_mode:"tap"},teas:{evidence_only:true,mastery_decision:false},emit:(type,payload={})=>{window.__AASHA_EVENTS__=(window.__AASHA_EVENTS__||[]).concat({type,payload,sequence_number:(window.__AASHA_EVENTS__||[]).length+1})}};const s=document.querySelector('#stage'),c=document.querySelector('#controls');let den=4,num=1;s.innerHTML='<svg viewBox="0 0 900 360" id="x"></svg>';let x=document.querySelector('#x');function d(){x.innerHTML=Array.from({length:den},(_,i)=>`<rect x='${100+i*150/den}' y='150' width='${150/den}' height='70' fill='${i<num?'currentColor':'#eef2f7'}' stroke='#8793a5'/>`).join('')+`<text x='450' y='270' text-anchor='middle' font-size='22'>${num}/${den}</text>`}let r=document.createElement('input');r.type='range';r.min=1;r.max=8;r.value=1;r.oninput=()=>{den=+r.value;num=Math.min(num,den);AASHA.emit('parameter_change',{den});d()};c.append('Denominator ',r);let b=document.createElement('button');b.textContent='Add part';b.onclick=()=>{num=Math.min(den,num+1);AASHA.emit('interaction',{num,den});d()};c.append(b);d();</script></main></body></html>
