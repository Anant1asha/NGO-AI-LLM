<script>
var NODES=[{"node_id": "EXAM-SIM-01", "title_en": "Offline Multi-Board Exam Readiness Simulator (Bloom Taxonomy)", "title_hi": "ऑफ़लाइन बहु-बोर्ड परीक्षा तत्परता सिम्युलेटर (ब्लूम वर्गीकरण)", "opts": [{"t": "Evaluate REMEMBER, UNDERSTAND, APPLY & ANALYZE weights with zero-spoiler feedback", "c": true, "m": "Verified! Balanced Bloom assessment prepares learners for board exams without rote memorization."}, {"t": "Show leaked exam answer keys before the student attempts the problem", "c": false, "m": "L-Truth strictly prevents answer leaks during practice and exam simulations."}]}, {"node_id": "VOC-MATCH-02", "title_en": "NCVET/PSSCIVE Vocational Apprenticeship & Rural Co-Op Matcher", "title_hi": "NCVET/PSSCIVE व्यावसायिक शिक्षुता और ग्रामीण सहकारी मिलान", "opts": [{"t": "Match >=80% TEAS mastery & Seva-certified students to local digital/agri apprenticeships", "c": true, "m": "Verified! Schoolbook mastery connects directly to real-world livelihood opportunities."}, {"t": "Share raw student names and phone numbers over unencrypted channels", "c": false, "m": "All apprenticeship matching uses zero-PII anonymous cryptographic tokens until guardian consent."}]}, {"node_id": "NAT-AUDIT-03", "title_en": "National 1,000-Centre Zero-PII & Zero-Bleed Telemetry Audit", "title_hi": "राष्ट्रीय 1,000-केंद्र शून्य-PII और शून्य-लागत टेलीमेट्री ऑडिट", "opts": [{"t": "Enforce $0.00 paid API bleed, <=$1.00/day cap & 100% Merkle integrity across 50,000 tablets", "c": true, "m": "Verified! National-scale offline execution runs within strict NGO cost and privacy bounds."}, {"t": "Allow unbounded paid cloud LLM calls from student tablets", "c": false, "m": "Student tablets run 100% offline HTML5 bundles with zero runtime cloud API calls."}]}];
var WE=[{"step":1,"title":"Bloom Readiness & NCVET QP Matching"}];
var WM={"fraction": "भिन्न (fraction)", "fractions": "भिन्न (fractions)", "numerator": "अंश (numerator)", "denominator": "हर (denominator)", "equivalent": "समतुल्य (equivalent)", "perimeter": "परिमाप (perimeter)", "area": "क्षेत्रफल (area)", "polynomial": "बहुपद (polynomial)", "percentage": "प्रतिशत (percentage)", "ratio": "अनुपात (ratio)", "proportion": "समानुपात (proportion)", "equation": "समीकरण (equation)", "variable": "चर (variable)", "constant": "अचर (constant)", "integer": "पूर्णांक (integer)", "triangle": "त्रिभुज (triangle)", "rectangle": "आयत (rectangle)", "square": "वर्ग (square)", "circle": "वृत्त (circle)", "angle": "कोण (angle)", "concept_term_001": "अवधारणा_पद_001 (concept_term_001)", "concept_term_002": "अवधारणा_पद_002 (concept_term_002)", "concept_term_003": "अवधारणा_पद_003 (concept_term_003)", "concept_term_004": "अवधारणा_पद_004 (concept_term_004)", "concept_term_005": "अवधारणा_पद_005 (concept_term_005)"};
var CONN={"therefore": "इसलिए (therefore)", "because": "क्योंकि (because)", "however": "हालांकि (however)", "for example": "उदाहरण के लिए (for example)", "in other words": "दूसरे शब्दों में (in other words)", "first": "सबसे पहले (first)", "next": "इसके बाद (next)", "finally": "अंत में (finally)", "remember": "याद रखें (remember)", "notice that": "ध्यान दें कि (notice that)", "connector_phrase_01": "संयोजक_वाक्यांश_01 (connector_phrase_01)", "connector_phrase_02": "संयोजक_वाक्यांश_02 (connector_phrase_02)", "connector_phrase_03": "संयोजक_वाक्यांश_03 (connector_phrase_03)", "connector_phrase_04": "संयोजक_वाक्यांश_04 (connector_phrase_04)", "connector_phrase_05": "संयोजक_वाक्यांश_05 (connector_phrase_05)"};
var _weCheckRendered = true;

function shuffle(arr) {
  return arr.slice().sort(function() { return Math.random() - 0.5; });
}
function loadExamHubState(k) {
  try { return JSON.parse(localStorage.getItem(k) || '{"idx":0,"qp":"SSC/Q0101"}'); } catch (e) { return {"idx":0,"qp":"SSC/Q0101"}; }
}
function saveExamHubState(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function computeBloomComposite(r, u, ap, an) {
  return Number((0.2 * r + 0.3 * u + 0.3 * ap + 0.2 * an).toFixed(4));
}
function isApprenticeshipEligible(mastery, sevaCerts) {
  return Number(mastery) >= 0.80 && Number(sevaCerts) >= 1;
}
function selectExamHubNode(i) {
  return NODES[Math.max(0, Math.min(NODES.length - 1, i))];
}
var App = {
  idx: 0,
  init: function() {
    var st = loadExamHubState('AASHA_G9_EXAM_HUB');
    this.idx = Number(st.idx || 0);
    _weCheckRendered = true;
    return selectExamHubNode(this.idx);
  },
  next: function() {
    this.idx = Math.min(NODES.length - 1, this.idx + 1);
    saveExamHubState('AASHA_G9_EXAM_HUB', { idx: this.idx, qp: 'AGR/Q4301' });
  },
  skip: function() { this.next(); },
  exit: function() {
    this.idx = 0;
    saveExamHubState('AASHA_G9_EXAM_HUB', { idx: 0, qp: 'SSC/Q0101' });
    if (typeof window !== 'undefined' && window.scrollTo) { window.scrollTo(0,0); }
    return 'reset';
  }
};
if (typeof window !== 'undefined') { App.init(); }
</script>
