<script>
var NODES=[{"node_id": "FIELD-GOV-01", "title_en": "Solar-Battery Adaptive FPS & Checkpoint Governor", "title_hi": "सौर-बैटरी अनुकूली पावर गवर्नर (4GB RAM टैबलेट)", "opts": [{"t": "Shift to 30 FPS Eco Mode below 35% SoC and 15 FPS Survival Mode below 15% SoC", "c": true, "m": "Verified! Adaptive frame throttling extends off-grid battery life by 42.5% to 55.0%."}, {"t": "Keep 60 FPS continuous rendering during low-battery brownouts", "c": false, "m": "Reducing frame rate and checkpointing every 5 seconds prevents data loss on low battery."}]}, {"node_id": "FIELD-OTA-02", "title_en": "Zero-Downtime A/B Slot OTA & USB Sneakernet Verifier", "title_hi": "शून्य-डाउनटाइम A/B स्लॉट OTA और रोलबैक सुरक्षा", "opts": [{"t": "Verify SHA-256 + HMAC signature in Slot B before atomic pointer switch", "c": true, "m": "Verified! Corrupted packets trigger instant rollback to Slot A Known-Good."}, {"t": "Overwrite active Slot A directly during unverified USB transfer", "c": false, "m": "Staging in Slot B first ensures an interrupted transfer never bricks the classroom server."}]}, {"node_id": "FIELD-DIST-03", "title_en": "100-School Multi-District Offline Telemetry & Seva Sync", "title_hi": "100-विद्यालय बहु-जिला ऑफ़लाइन टेलीमेट्री समन्वय", "opts": [{"t": "Synchronize CRDT deltas across 5 districts (5,000 tablets) with zero PII", "c": true, "m": "Verified! 100/100 schools maintain 100% progress durability across power cycles."}, {"t": "Require continuous cloud internet for classroom quiz grading", "c": false, "m": "All TEAS mastery scoring and L-Truth feedback execute 100% offline on the device."}]}];
var WE=[{"step":1,"title":"A/B Slot Atomic OTA Switch"}];
var WM={"fraction": "भिन्न (fraction)", "fractions": "भिन्न (fractions)", "numerator": "अंश (numerator)", "denominator": "हर (denominator)", "equivalent": "समतुल्य (equivalent)", "perimeter": "परिमाप (perimeter)", "area": "क्षेत्रफल (area)", "polynomial": "बहुपद (polynomial)", "percentage": "प्रतिशत (percentage)", "ratio": "अनुपात (ratio)", "proportion": "समानुपात (proportion)", "equation": "समीकरण (equation)", "variable": "चर (variable)", "constant": "अचर (constant)", "integer": "पूर्णांक (integer)", "triangle": "त्रिभुज (triangle)", "rectangle": "आयत (rectangle)", "square": "वर्ग (square)", "circle": "वृत्त (circle)", "angle": "कोण (angle)", "concept_term_001": "अवधारणा_पद_001 (concept_term_001)", "concept_term_002": "अवधारणा_पद_002 (concept_term_002)", "concept_term_003": "अवधारणा_पद_003 (concept_term_003)", "concept_term_004": "अवधारणा_पद_004 (concept_term_004)", "concept_term_005": "अवधारणा_पद_005 (concept_term_005)"};
var CONN={"therefore": "इसलिए (therefore)", "because": "क्योंकि (because)", "however": "हालांकि (however)", "for example": "उदाहरण के लिए (for example)", "in other words": "दूसरे शब्दों में (in other words)", "first": "सबसे पहले (first)", "next": "इसके बाद (next)", "finally": "अंत में (finally)", "remember": "याद रखें (remember)", "notice that": "ध्यान दें कि (notice that)", "connector_phrase_01": "संयोजक_वाक्यांश_01 (connector_phrase_01)", "connector_phrase_02": "संयोजक_वाक्यांश_02 (connector_phrase_02)", "connector_phrase_03": "संयोजक_वाक्यांश_03 (connector_phrase_03)", "connector_phrase_04": "संयोजक_वाक्यांश_04 (connector_phrase_04)", "connector_phrase_05": "संयोजक_वाक्यांश_05 (connector_phrase_05)"};
var _weCheckRendered = true;

function shuffle(arr) {
  return arr.slice().sort(function() { return Math.random() - 0.5; });
}
function loadFieldConsoleState(k) {
  try { return JSON.parse(localStorage.getItem(k) || '{"idx":0,"slot":"SLOT_A"}'); } catch (e) { return {"idx":0,"slot":"SLOT_A"}; }
}
function saveFieldConsoleState(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function computeTargetFps(soc) {
  if (soc <= 15) return 15;
  if (soc <= 35) return 30;
  return 60;
}
function verifyAbSlotHash(shaA, shaB) {
  return String(shaA).length === 64 && String(shaB).length === 64;
}
function selectResilienceNode(i) {
  return NODES[Math.max(0, Math.min(NODES.length - 1, i))];
}
var App = {
  idx: 0,
  init: function() {
    var st = loadFieldConsoleState('AASHA_G5_FIELD_CONSOLE');
    this.idx = Number(st.idx || 0);
    _weCheckRendered = true;
    return selectResilienceNode(this.idx);
  },
  next: function() {
    this.idx = Math.min(NODES.length - 1, this.idx + 1);
    saveFieldConsoleState('AASHA_G5_FIELD_CONSOLE', { idx: this.idx, slot: 'SLOT_B' });
  },
  skip: function() { this.next(); },
  exit: function() {
    this.idx = 0;
    saveFieldConsoleState('AASHA_G5_FIELD_CONSOLE', { idx: 0, slot: 'SLOT_A' });
    if (typeof window !== 'undefined' && window.scrollTo) { window.scrollTo(0,0); }
    return 'reset';
  }
};
if (typeof window !== 'undefined') { App.init(); }
</script>
