<script>
var NODES=[{"node_id": "SOLAR-LIB-01", "title_en": "Offline Solar-Powered Library & Open-Textbook (CC-BY-SA) Harvester", "title_hi": "ऑफ़लाइन सौर-संचालित पुस्तकालय और मुक्त पाठ्यपुस्तक संचयनकर्ता", "opts": [{"t": "Index 300 open-license chapters with 74% Merkle deduplication & <20 MiB per pack", "c": true, "m": "Verified! Every rural solar micro-server hosts a rich bilingual STEM and foundational library offline."}, {"t": "Include proprietary unverified PDFs without license or TLN checksums", "c": false, "m": "AASHA harvests only license-verified open educational resources anchored to schoolbook truth."}]}, {"node_id": "STEM-FAIR-02", "title_en": "Inter-District Frugal STEM & Eco/Jal Seva Innovation Fair Judge", "title_hi": "अंतर-जिला ग्रामीण STEM और इको/जल सेवा नवाचार मेला निर्णायक", "opts": [{"t": "Evaluate scientific rigor (40%), village utility (35%) & frugal local materials (25%)", "c": true, "m": "Verified! Student prototypes like solar grain dryers and bio-sand filters earn Seva innovation grants."}, {"t": "Judge student projects solely on expensive imported kit components", "c": false, "m": "Frugal rural innovation rewards scientific thinking and local sustainability."}]}, {"node_id": "SOV-SEAL-03", "title_en": "100,000-Centre / 2,000-Block Sovereign AIOS Seal (33/33 Chunks Verified)", "title_hi": "100,000-केंद्र / 2,000-ब्लॉक संप्रभु AIOS सील (33/33 चंक्स सत्यापित)", "opts": [{"t": "Certify 100,000 centres across 2,000 blocks with 1,080 hibernating agents & $0.00 API bleed", "c": true, "m": "Verified! Sovereign offline AIOS scales to 100,000 centres with zero cloud dependency."}, {"t": "Allow central cloud outages to interrupt village classroom sessions", "c": false, "m": "Every centre operates autonomously with 100% local HTML5 and SQLite persistence."}]}];
var WE=[{"step":1,"title":"Merkle Open-Textbook Deduplication & Frugal STEM Prototype Rubric"}];
var WM={"fraction": "भिन्न (fraction)", "fractions": "भिन्न (fractions)", "numerator": "अंश (numerator)", "denominator": "हर (denominator)", "equivalent": "समतुल्य (equivalent)", "perimeter": "परिमाप (perimeter)", "area": "क्षेत्रफल (area)", "polynomial": "बहुपद (polynomial)", "percentage": "प्रतिशत (percentage)", "ratio": "अनुपात (ratio)", "proportion": "समानुपात (proportion)", "equation": "समीकरण (equation)", "variable": "चर (variable)", "constant": "अचर (constant)", "integer": "पूर्णांक (integer)", "triangle": "त्रिभुज (triangle)", "rectangle": "आयत (rectangle)", "square": "वर्ग (square)", "circle": "वृत्त (circle)", "angle": "कोण (angle)", "concept_term_001": "अवधारणा_पद_001 (concept_term_001)", "concept_term_002": "अवधारणा_पद_002 (concept_term_002)", "concept_term_003": "अवधारणा_पद_003 (concept_term_003)", "concept_term_004": "अवधारणा_पद_004 (concept_term_004)", "concept_term_005": "अवधारणा_पद_005 (concept_term_005)"};
var CONN={"therefore": "इसलिए (therefore)", "because": "क्योंकि (because)", "however": "हालांकि (however)", "for example": "उदाहरण के लिए (for example)", "in other words": "दूसरे शब्दों में (in other words)", "first": "सबसे पहले (first)", "next": "इसके बाद (next)", "finally": "अंत में (finally)", "remember": "याद रखें (remember)", "notice that": "ध्यान दें कि (notice that)", "connector_phrase_01": "संयोजक_वाक्यांश_01 (connector_phrase_01)", "connector_phrase_02": "संयोजक_वाक्यांश_02 (connector_phrase_02)", "connector_phrase_03": "संयोजक_वाक्यांश_03 (connector_phrase_03)", "connector_phrase_04": "संयोजक_वाक्यांश_04 (connector_phrase_04)", "connector_phrase_05": "संयोजक_वाक्यांश_05 (connector_phrase_05)"};
var _weCheckRendered = true;

function shuffle(arr) {
  return arr.slice().sort(function() { return Math.random() - 0.5; });
}
function loadG15HubState(k) {
  try { return JSON.parse(localStorage.getItem(k) || '{"idx":0,"centres":100000}'); } catch (e) { return {"idx":0,"centres":100000}; }
}
function saveG15HubState(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function computeStemFairScore(rigor, utility, frugal) {
  return Number((0.40 * Number(rigor) + 0.35 * Number(utility) + 0.25 * Number(frugal)).toFixed(4));
}
function isLibraryPackUnderCeiling(sizeMb) {
  return Number(sizeMb) < 20.0;
}
function selectG15Node(i) {
  return NODES[Math.max(0, Math.min(NODES.length - 1, i))];
}
var App = {
  idx: 0,
  init: function() {
    var st = loadG15HubState('AASHA_G15_SOLAR_STEM');
    this.idx = Number(st.idx || 0);
    _weCheckRendered = true;
    return selectG15Node(this.idx);
  },
  next: function() {
    this.idx = Math.min(NODES.length - 1, this.idx + 1);
    saveG15HubState('AASHA_G15_SOLAR_STEM', { idx: this.idx, centres: 100000 });
  },
  skip: function() { this.next(); },
  exit: function() {
    this.idx = 0;
    saveG15HubState('AASHA_G15_SOLAR_STEM', { idx: 0, centres: 100000 });
    if (typeof window !== 'undefined' && window.scrollTo) { window.scrollTo(0,0); }
    return 'reset';
  }
};
if (typeof window !== 'undefined') { App.init(); }
