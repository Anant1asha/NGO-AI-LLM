id = "inbox-sentinel"
semver = "1.0.0"
min_agent_version = "0.1.0"
description = "Autonomous Gmail triage loop: classifies urgency, labels, drafts deferrals, escalates critical messages to Slack."
author = "Hachi Team"

scopes = [
    "gmail.read",
    "gmail.write",
    "slack.send",
]

fs_paths = []

[schedule_budget]
max_runs_per_day = 96   # up to every 15 min for focus sessions
max_cost_per_run = 0.05
