[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "hachi-og"
version = "0.1.0"
description = "Hachi - The Autonomous Agent Engine powered by ObjectGraph (.og)"
readme = "README.md"
requires-python = ">=3.11"
# Apache-2.0 rather than MIT: the express patent grant (§3) and the explicit
# trademark carve-out (§6) matter for a product whose pitch is security, and §6 is
# what stops a fork presenting itself as the official project. See TRADEMARK.md.
# PEP 639 form: an SPDX expression plus declared license files.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Open Gigantic" }
]
keywords = [
    "ai",
    "agent",
    "llm",
    "anthropic",
    "objectgraph",
    "autonomous-agent",
    "telegram-bot",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.136.3",
    # P-11 (same defect as cryptography): the floor admitted vulnerable versions.
    # >=1.2.3 permits CVE-2026-54282 (fixed in 1.3.0) and CVE-2026-54283 (fixed
    # in 1.3.1). Raise to the fixed series so the *published metadata* excludes
    # them, not merely our own lock file.
    "starlette>=1.3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.48.0",
    "anthropic>=0.105.2",
    "httpx>=0.28.0",
    # HIGH-022: CVE-2026-45829 — pin to >=1.5.9 (latest available; no patched release yet).
    # NOTE: 1.5.9 is the newest release on PyPI and carries FOUR unpatched advisories,
    # not one — CVE-2026-45829 (critical), CVE-2026-45833 (critical), CVE-2026-45830
    # (high), CVE-2026-45831 (high). That is why chromadb is a candidate for the
    # optional-extra treatment rather than a further bump (see SECURITY.md).
    #
    # aiohttp is transitive (chromadb -> kubernetes, which allows <4.0.0), so it is
    # held at >=3.14.5 by uv.lock only. Hachi never imports aiohttp; if chromadb moves
    # to an optional extra, this constraint moves with it.
    "chromadb>=1.5.9",
    "platformdirs>=4.3.0",
    "keyring>=25.5.0",
    # P-11: the floor was 48.0.1 while the lock resolved 49.0.0 — i.e. the declared
    # metadata admitted the exact version that carries CVE-2026-69247 (HIGH, PKCS#7
    # EnvelopedData Bleichenbacher, fixed in 50.0.0). Pin to the fixed series so the
    # published floor excludes it, not just our own lock file.
    "cryptography>=50.0.0",
    "tomlkit>=0.13.2",
    "typer>=0.26.4",
    "rich>=13.7.0",
    "textual>=0.75.0",
    # P-31: the old floor admitted 12.2.0, which carries ten PYSEC advisories
    # fixed in 12.3.0. Pin to the fixed series so the published metadata
    # excludes them (same thesis as the cryptography/starlette floors above).
    "Pillow>=12.3.0",
    "tzdata>=2024.1",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.15",
    "mypy>=1.11.0",
    # Guardrails Phase 2 — the Rails (dev-only static analysis; never imported by the
    # product). Wired into scripts/preflight.py and CI. import-linter enforces the
    # architectural layering (anti-drift); deptry flags unused/missing deps; vulture
    # finds dead code. All run via `uv run` against an `--extra dev` env.
    "import-linter>=2.0",
    "deptry>=0.20.0",
    "vulture>=2.11",
]
memory = [
    "chromadb>=1.5.9",
]
local-models = [
    "httpx>=0.28.0",
]
search = [
    "tavily-python>=0.3.0",
]
browser = [
    "playwright>=1.48.0",
]
files = [
    "pypdf>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
]
tracing = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]
# Full observability stack — OTLP exporter + Langfuse support.
# Install: pip install 'hachi-og[observability]'
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
presentations = [
    "python-pptx>=1.0.0",
]
# Opt-in for providers that use reverse-engineered web APIs (potential ToS risk).
# Install with: pip install hachi-og[unofficial]
# Then set HACHI_UNOFFICIAL=1 to actually enable the provider.
unofficial = []
# Security-scanning tools — used by CI (security job) and local audits.
# Install with: uv sync --extra security
security = [
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/OpenGigantic/hachi"
Repository = "https://github.com/OpenGigantic/hachi"
Issues = "https://github.com/OpenGigantic/hachi/issues"

[project.scripts]
hachi = "hachi.cli.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"] # flake8, isort, warnings, bugbear, pyupgrade
ignore = []

# Complexity thresholds for the ADVISORY god-function check (Guardrails Phase 2).
# These PLR rules are deliberately NOT in `select` above, so the blocking `ruff check`
# stays green. scripts/preflight.py runs them as a separate non-blocking step
# (`ruff check --select PLR0911,PLR0912,PLR0913,PLR0915 --statistics`) to surface the
# trend in oversized functions without gating on ~178 pre-existing violations. Thresholds
# sit above ruff's strict defaults so only genuine outliers are counted.
[tool.ruff.lint.pylint]
max-args = 8         # default 5
max-branches = 15    # default 12
max-returns = 8      # default 6
max-statements = 60  # default 50

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["tokoboros", "*.egg", ".git", ".venv", "node_modules", "build", "dist"]
# --dist=loadfile keeps all tests from the same file on the same worker, preventing
# module-level singleton / patch.dict conflicts. Pass -n <N> or -n auto on the CLI.
addopts = "--dist=loadfile"

[tool.hatch.build]
# Keep agent/tool scratch out of published artifacts. `.anvaya/` is the scratch
# directory used by agent tooling and can reach ~95 MB including full copies of
# this repository; none of it should ever ship.
#
# NOTE: this exclude does NOT by itself make `uv build` safe in a worktree that
# contains such scratch — see BB-94. A tree containing `.anvaya/` still produced
# a 15 KB wheel with no `src/` and no `.og` skills (build reported success).
# Build release artifacts from a clean checkout or CI.
exclude = [
  "/.anvaya",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/.import_linter_cache",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hachi"]

# ---------------------------------------------------------------------------
# import-linter — the architectural rail (Guardrails Phase 2).
# Enforces Hachi's layering so the domain can't silently grow a dependency on
# its delivery edges (the "architectural drift" pain). Run by scripts/preflight.py
# and CI via `uv run lint-imports`.
#
# Intended layers (high -> low; higher may import lower, never the reverse):
#   edges    : cli, tui, channels        (entry adapters / transports)
#   service  : gateway, client, sdk      (the REST surface + its consumers)
#   engine   : core, og_engine, tools, jobs, integrations   (the foundation)
#
# Each `ignore_imports` line is a FROZEN, pre-existing inversion seam — visible
# debt to burn down, not a license to add more. A NEW cross-layer import that is
# not on an allowlist fails the gate. Do not add an ignore without a comment
# saying why the seam exists and how it should eventually be removed.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "hachi"
# Only check first-party imports; external packages are irrelevant to layering.
include_external_packages = false

[[tool.importlinter.contracts]]
name = "og_engine is pure (the .og moat depends on nothing but core)"
type = "forbidden"
source_modules = ["hachi.og_engine"]
forbidden_modules = [
    "hachi.gateway",
    "hachi.client",
    "hachi.sdk",
    "hachi.cli",
    "hachi.tui",
    "hachi.channels",
    "hachi.tools",
    "hachi.jobs",
    "hachi.integrations",
]

[[tool.importlinter.contracts]]
name = "the engine must not import the UI/entry edges (cli, tui)"
type = "forbidden"
source_modules = [
    "hachi.core",
    "hachi.og_engine",
    "hachi.tools",
    "hachi.jobs",
    "hachi.integrations",
]
forbidden_modules = ["hachi.cli", "hachi.tui"]
ignore_imports = [
    # SEAM: cold-start resume needs the CLI's Typer app to rebuild a session's
    # command context. Lazy import inside resume(); should move behind a control-plane
    # protocol so core no longer names the CLI. Tracked as an honest seam in memory.
    "hachi.core.runtime.resume -> hachi.cli.main",
]

[[tool.importlinter.contracts]]
name = "the engine must not import the gateway service (freeze known seams)"
type = "forbidden"
source_modules = [
    "hachi.core",
    "hachi.og_engine",
    "hachi.tools",
    "hachi.jobs",
    "hachi.integrations",
]
forbidden_modules = ["hachi.gateway"]
# Check DIRECT engine->gateway edges only. The one indirect path (core -> cli.main ->
# gateway.workspace) is the cli seam already frozen by the contract above; cli importing
# the gateway is correct edge->service layering, not a new domain coupling.
allow_indirect_imports = "true"
ignore_imports = [
    # SEAMS: these reach up into the gateway for shared-session/workspace services
    # that have no engine-level home yet. All lazy except onboarding. Burn down by
    # introducing a GatewayControlPlane protocol owned by core.
    "hachi.core.onboarding -> hachi.gateway.workspace",
    "hachi.core.cost -> hachi.gateway.shared_services",
    "hachi.core.runtime.job_handlers -> hachi.gateway.orchestrator",
    "hachi.core.runtime.resume -> hachi.gateway.shared_services",
    "hachi.tools.config_tools -> hachi.gateway.workspace",
]

# ---------------------------------------------------------------------------
# deptry — the dependency rail (Guardrails Phase 2). Catches a dependency that is
# declared-but-unused (bloat) or imported-but-undeclared (a broken extra that
# ModuleNotFunds in production). Run by scripts/preflight.py and CI on `src/`.
#
# Hachi's runtime is intentionally thin; almost everything optional lives behind a
# `[project.optional-dependencies]` extra and is imported lazily. deptry must be
# told the truth about that shape or it cries wolf on every extra. Each entry below
# is a fact about the architecture, not a suppression of a real problem.
# ---------------------------------------------------------------------------
[tool.deptry]
# `benchmarks/` is a repo-local package, not a PyPI dependency.
known_first_party = ["benchmarks"]
# Tooling-only extras: their packages are CLIs/test deps, never imported by src.
optional_dependencies_dev_groups = ["dev", "security"]

[tool.deptry.package_module_name_map]
# Distributions whose import name differs from the package name, so deptry can match
# the lazy import in an integration/tool back to its declared extra.
python-docx = ["docx"]
python-pptx = ["pptx"]
python-multipart = ["multipart"]
tavily-python = ["tavily"]
opentelemetry-exporter-otlp-proto-http = ["opentelemetry"]

[tool.vulture]
# Dead-code rail (Guardrails Phase 2) — advisory in scripts/preflight.py via `uv run vulture`.
# min_confidence 80 reports only near-certain dead code (unused locals/imports, unreachable
# branches) and skips vulture's noisy 60%-confidence guesses about unused methods/attributes,
# which false-positive on framework entry points (FastAPI routes, Textual handlers, fixtures).
# The decorator/name ignores keep it quiet if that confidence floor is ever lowered.
paths = ["src"]
min_confidence = 80
ignore_decorators = [
    "@app.*", "@router.*", "@*.command", "@*.callback", "@*.route",
    "@on", "@work", "@pytest.fixture", "@field_validator", "@model_validator",
]
# exc_type/exc_val/exc_tb are the protocol-required params of __exit__/__aexit__ —
# unused by contract, not dead code.
ignore_names = ["visit_*", "on_*", "test_*", "exc_type", "exc_val", "exc_tb"]

[tool.deptry.per_rule_ignores]
# DEP002 (declared but not imported) — CONFIRMED false positives only:
#   tzdata           — IANA tz database for zoneinfo on Windows; data-only, imported by nothing.
#   tavily-python    — loaded via importlib.import_module("tavily") in core/providers/
#                      tavily_provider.py; a dynamic import static analysis cannot see.
#   python-multipart — provides the `multipart` module Starlette imports to parse form/file
#                      uploads; a runtime dep of the gateway, never imported by Hachi directly.
DEP002 = ["tzdata", "tavily-python", "python-multipart"]
# DEP003 (transitive): anyio is used directly but supplied transitively by
# fastapi/anthropic; a top-level pin buys nothing.
DEP003 = ["anyio"]
